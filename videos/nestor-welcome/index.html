<!doctype html>
<html lang="fr" data-composition-variables="[
    {&quot;id&quot;:&quot;lang&quot;,&quot;type&quot;:&quot;enum&quot;,&quot;label&quot;:&quot;Language&quot;,&quot;default&quot;:&quot;fr&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;fr&quot;,&quot;label&quot;:&quot;Français&quot;},{&quot;value&quot;:&quot;en&quot;,&quot;label&quot;:&quot;English&quot;}]}
  ]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Nestor — bienvenue</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Marianne";
        src: url("assets/fonts/Marianne-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Marianne";
        src: url("assets/fonts/Marianne-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Marianne";
        src: url("assets/fonts/Marianne-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Marianne";
        src: url("assets/fonts/Marianne-ExtraBold.woff2") format("woff2");
        font-weight: 800;
      }
      :root {
        --canvas: #f7f8fd;
        --ink: #161616;
        --muted: #4f5568;
        --navy: #000091;
        --icon: #5a58d6;
        --red: #e1000f;
        --card: #ffffff;
        --line: #dde0ee;
        --soft: #eef0ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
        font-family: "Marianne", sans-serif;
        color: var(--ink);
      }
      .ground {
        position: absolute;
        inset: 0;
        background: var(--canvas);
      }
      #flag {
        position: absolute;
        left: 90px;
        top: 96px;
        width: 150px;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--navy) 33%, #ffffff 33% 66%, var(--red) 66%);
        box-shadow: 0 0 0 1px var(--line);
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 170px 80px 110px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .h2 {
        font-size: 80px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--navy);
      }
      .card {
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 36px;
        box-shadow: 0 18px 40px rgba(0, 0, 145, 0.07);
      }
      .round {
        display: block;
        border-radius: 50%;
        object-fit: cover;
        background: var(--canvas);
      }

      /* 1 · Nestor */
      #s1-art {
        width: 480px;
        border-radius: 48px;
        overflow: hidden;
        background: #f4f5fe;
        box-shadow: 0 30px 70px rgba(0, 0, 145, 0.12);
      }
      #s1-art img {
        display: block;
        width: 100%;
        height: auto;
      }
      #s1-title {
        margin-top: 64px;
        font-size: 190px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--navy);
      }
      #s1-sub {
        margin-top: 36px;
        max-width: 860px;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.22;
        color: var(--muted);
      }

      /* 2 · Home cards */
      #s2-head {
        margin-bottom: 52px;
      }
      .home {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #c-coach {
        width: 660px;
        padding: 44px 44px 48px;
        border-color: var(--navy);
        border-width: 4px;
      }
      #c-coach img {
        width: 190px;
        height: 190px;
      }
      #c-coach .t {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.1;
        color: var(--navy);
      }
      #c-coach .d {
        font-size: 56px;
        font-weight: 500;
        line-height: 1.24;
        color: var(--muted);
      }
      .grid {
        margin-top: 36px;
        display: grid;
        grid-template-columns: 440px 440px;
        gap: 36px;
        justify-content: center;
      }
      .grid .home {
        padding: 36px 24px 40px;
      }
      .grid .home img {
        width: 150px;
        height: 150px;
      }
      .grid .home .t {
        font-size: 58px;
        font-weight: 800;
        line-height: 1.12;
        color: var(--navy);
      }
      .grid .alone {
        grid-column: 1 / -1;
        justify-self: center;
        width: 440px;
      }

      /* 3 · The coach's four buttons */
      #s3-head {
        margin-bottom: 64px;
      }
      .bar {
        display: grid;
        grid-template-columns: 440px 440px;
        gap: 36px;
        justify-content: center;
      }
      .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        padding: 48px 24px 52px;
      }
      .ico {
        flex: none;
        width: 176px;
        height: 176px;
        border-radius: 50%;
        border: 3px solid var(--line);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .ico svg {
        width: 88px;
        height: 88px;
      }
      .ico img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .btn .t {
        font-size: 58px;
        font-weight: 700;
        line-height: 1.15;
        color: var(--ink);
      }

      /* 4 · Close */
      #s4-art {
        width: 600px;
        height: 600px;
        box-shadow: 0 30px 70px rgba(0, 0, 145, 0.12);
        border: 4px solid #ffffff;
      }
      #s4-tag {
        margin-top: 80px;
        max-width: 880px;
        font-size: 100px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920" data-fps="30">
      <div id="ground" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div class="ground"></div>
        <div id="flag"></div>
      </div>

      <!-- 1 · Nestor -->
      <section id="s1" class="scene clip" data-start="0" data-duration="5.2" data-track-index="1">
        <div id="s1-in" class="wrap">
          <div id="s1-art" data-layout-allow-overflow><img src="assets/nestor-portrait.webp" alt="" /></div>
          <div id="s1-title">Nestor</div>
          <div id="s1-sub" data-t="tagline"></div>
        </div>
      </section>

      <!-- 2 · Home cards, as they are today -->
      <section id="s2" class="scene clip" data-start="4.8" data-duration="7.8" data-track-index="2">
        <div id="s2-in" class="wrap">
          <div id="s2-head" class="h2" data-t="home"></div>
          <div id="c-coach" class="card home">
            <img class="round" src="assets/nestor-analyse.webp" alt="" />
            <span class="t" data-t="coach"></span>
            <span class="d" data-t="coachDesc"></span>
          </div>
          <div class="grid">
            <div id="c-rec" class="card home">
              <img class="round" src="assets/nestor-transcription.webp" alt="" />
              <span class="t" data-t="record"></span>
            </div>
            <div id="c-course" class="card home">
              <img class="round" src="assets/nestor-cours.webp" alt="" />
              <span class="t" data-t="course"></span>
            </div>
            <div id="c-tools" class="card home alone">
              <img class="round" src="assets/nestor-outils.webp" alt="" />
              <span class="t" data-t="tools"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- 3 · The coach's four buttons -->
      <section id="s3" class="scene clip" data-start="12.2" data-duration="7.4" data-track-index="3">
        <div id="s3-in" class="wrap">
          <div id="s3-head" class="h2" data-t="inCoach"></div>
          <div class="bar">
            <div id="b1" class="card btn">
              <div class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#5a58d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
              </div>
              <span class="t" data-t="analyse"></span>
            </div>
            <div id="b2" class="card btn">
              <div class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#5a58d6" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3.5 11.7 8.3 16.5 10 11.7 11.7 10 16.5 8.3 11.7 3.5 10 8.3 8.3Z" /><path d="M18 14.5 18.9 17.1 21.5 18 18.9 18.9 18 21.5 17.1 18.9 14.5 18 17.1 17.1Z" /><path d="M18 2.5 18.6 4.4 20.5 5 18.6 5.6 18 7.5 17.4 5.6 15.5 5 17.4 4.4Z" /></svg>
              </div>
              <span class="t" data-t="improve"></span>
            </div>
            <div id="b3" class="card btn">
              <div class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#5a58d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 11 13 15 21 7" /><path d="M15 7h6v6" /></svg>
              </div>
              <span class="t" data-t="review"></span>
            </div>
            <div id="b4" class="card btn">
              <div class="ico"><img src="assets/nestor-avatar.webp" alt="" /></div>
              <span class="t" data-t="ask"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4 · Close -->
      <section id="s4" class="scene clip" data-start="19.2" data-duration="5.8" data-track-index="4">
        <div id="s4-in" class="wrap">
          <img id="s4-art" class="round" src="assets/nestor-accueil.webp" alt="" />
          <div id="s4-tag" data-t="close"></div>
        </div>
      </section>
    </div>

    <script>
      const NB = " ";
      const STRINGS = {
        fr: {
          tagline: `Votre coach pour bien demander à${NB}l’IA`,
          home: "À l’accueil",
          coach: "Coach",
          coachDesc: `Améliore vos demandes, avant et après la${NB}réponse.`,
          record: "Enregistrer et transcrire",
          course: "Cours",
          tools: "Outils du quotidien",
          inCoach: "Dans le Coach",
          analyse: "Analyser mon texte",
          improve: "Améliorer mon texte",
          review: "Faire le bilan",
          ask: `Demander à${NB}Nestor`,
          close: `Commencez avec le${NB}Coach.`,
        },
        en: {
          tagline: `Your coach to ask AI${NB}well`,
          home: "On the home page",
          coach: "Coach",
          coachDesc: `Improves your requests, before and after the${NB}answer.`,
          record: "Record and transcribe",
          course: "Course",
          tools: "Everyday tools",
          inCoach: "In the Coach",
          analyse: "Analyse my text",
          improve: "Improve my text",
          review: "Do the review",
          ask: `Ask${NB}Nestor`,
          close: `Start with the${NB}Coach.`,
        },
      };

      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const lang = vars.lang === "en" ? "en" : "fr";
      const S = STRINGS[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => {
        el.textContent = S[el.dataset.t];
      });

      const tl = gsap.timeline({ paused: true });
      const out = "power3.out";
      const fadeIn = (sel, at, y = 40, d = 0.7) =>
        tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: out }, at);
      const fadeOut = (sel, at, d = 0.45) =>
        tl.to(sel, { opacity: 0, y: -30, duration: d, ease: "power2.in" }, at);

      // Ground: the blue-white-red dash.
      tl.fromTo("#flag", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.8, ease: out }, 0.2);

      // 1 · Nestor (0 – 5.2)
      tl.fromTo("#s1-art", { opacity: 0, y: 60, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 1, ease: out }, 0.2);
      tl.fromTo("#s1-art img", { scale: 1 }, { scale: 1.05, duration: 4.6, ease: "none" }, 0.2);
      fadeIn("#s1-title", 0.7, 50, 0.8);
      fadeIn("#s1-sub", 1.2);
      fadeOut("#s1-in", 4.7);

      // 2 · Home cards (4.8 – 12.6)
      fadeIn("#s2-head", 5.0);
      tl.fromTo("#c-coach", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: out }, 5.4);
      ["#c-rec", "#c-course", "#c-tools"].forEach((sel, i) => {
        fadeIn(sel, 7.8 + i * 0.25, 50, 0.6);
      });
      fadeOut("#s2-in", 12.1);

      // 3 · The coach's four buttons (12.2 – 19.6)
      fadeIn("#s3-head", 12.4);
      ["#b1", "#b2", "#b3", "#b4"].forEach((sel, i) => {
        fadeIn(sel, 12.8 + i * 0.15, 50, 0.6);
      });
      // A calm ring over each button in turn.
      ["#b1", "#b2", "#b3", "#b4"].forEach((sel, i) => {
        const at = 14.2 + i * 1.15;
        tl.to(sel, { scale: 1.04, borderColor: "#000091", backgroundColor: "#eef0ff", duration: 0.3, ease: out }, at);
        tl.to(sel, { scale: 1, borderColor: "#dde0ee", backgroundColor: "#ffffff", duration: 0.35, ease: "power2.inOut" }, at + 0.85);
      });
      fadeOut("#s3-in", 19.1);

      // 4 · Close (19.2 – 25)
      tl.fromTo("#s4-art", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.9, ease: out }, 19.4);
      fadeIn("#s4-tag", 19.9, 40, 0.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
