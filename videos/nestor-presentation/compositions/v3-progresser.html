<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /><title>v3-progresser</title></head>
  <body>
    <template>
      <style>

@font-face { font-family: "Marianne"; src: url("assets/fonts/Marianne-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Marianne"; src: url("assets/fonts/Marianne-Medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Marianne"; src: url("assets/fonts/Marianne-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Marianne"; src: url("assets/fonts/Marianne-ExtraBold.woff2") format("woff2"); font-weight: 800; }


#root { position: absolute; inset: 0; overflow: hidden; font-family: "Marianne", sans-serif; color: #161616; }
#v3-progresser-bg { position: absolute; inset: 0; background: #f7f8fd; }
#v3-progresser-flag { position: absolute; left: 120px; top: 64px; width: 150px; height: 10px; border-radius: 5px;
  background: linear-gradient(90deg, #000091 33%, #ffffff 33% 66%, #e1000f 66%); box-shadow: 0 0 0 1px #dde0ee; }
#v3-progresser-content { position: absolute; inset: 0; }

#v3-progresser-stack { position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.v3-progresser-l { font-size: 150px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; color: #000091; }
.v3-progresser-l.second { color: #161616; }

      </style>
      <div id="root" data-composition-id="v3-progresser" data-start="0" data-duration="4.8" data-width="1920" data-height="1080">
        <div id="v3-progresser-bg"></div>
        <div id="v3-progresser-flag"></div>
        <div id="v3-progresser-content">
          <div id="v3-progresser-stack"><div class="v3-progresser-l" id="v3-progresser-l0">Et vous progressez,</div><div class="v3-progresser-l second" id="v3-progresser-l1">semaine après semaine.</div></div>
        </div>
      </div>
      <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#v3-progresser-content", {opacity: 0}, {opacity: 1, duration: 0.5, ease: "sine.out"}, 0);
      tl.to("#v3-progresser-content", {opacity: 0, duration: 0.45, ease: "sine.in"}, 4.35);
      tl.fromTo("#v3-progresser-l0", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.9, ease: "power3.out"}, 0.30);
      tl.fromTo("#v3-progresser-l1", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.9, ease: "power3.out"}, 1.50);
      window.__timelines["v3-progresser"] = tl;
      </script>
    </template>
  </body>
</html>
