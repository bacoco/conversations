# Rate limits of the Albert relay (used only when the relay is enabled, see
# conf/templates/albert.conf.template). Behind the ingress, the client is
# identified by X-Forwarded-For.
map $http_x_forwarded_for $albert_client {
    "" $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $albert_client zone=albert_chat:10m rate=30r/m;
limit_req_zone $albert_client zone=albert_embed:10m rate=120r/m;

server {
  listen 8080;
  listen 3000;
  server_name localhost;

  # Emit relative Location headers on directory redirects. Behind the TLS
  # ingress, absolute redirects would otherwise leak nginx's own scheme/port
  # (e.g. http://host:8080/), which is unreachable publicly.
  absolute_redirect off;

  root /usr/share/nginx/html;

  # The API is served from its own origin; this server only holds static files.
  # Without this, an /api request sent here by mistake would reach the fallback
  # below and answer 200 with index.html instead of failing.
  location /api/ {
      return 404;
  }

  # Albert relay for the prompt panel: present only when configured (see
  # conf/templates/albert.conf.template). Otherwise /albert/ answers 404 and
  # the panel runs without its AI features.
  include /tmp/nginx-albert/*.conf;
  location /albert/ {
      return 404;
  }

  # Single-page app: every unknown path is handed to the client router, which
  # renders the 404 page itself. Unknown paths therefore answer 200, not 404.
  location / {
      try_files $uri $uri/ /index.html;
  }
}
